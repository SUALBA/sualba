name: Generate Snake
on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: SUALBA
          outputs: |
            # 1) Estilo “Matrix” (serpiente verde + dots verde → claro)
            dist/github-contribution-grid-snake-matrix.svg?color_snake=#00ff88&color_dots=#0a0a0a,#094d2b,#0ea24a,#12d66f,#5dff9a

            # 2) Cyber gradient (verde→cian)
            dist/github-contribution-grid-snake-cyber.svg?color_snake=#00ffd1&color_dots=#0a0a0a,#0b3a3a,#0f6f6f,#13a3a3,#18d9d9

            # 3) Dark theme con preset + snake lima
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#a7f542

            # 4) Rainbow (divertido/festivo)
            dist/github-contribution-grid-snake-rainbow.svg?color_snake=#ff6b6b&color_dots=#2b2b2b,#ff6b6b,#ffd93d,#6bcB77,#4d96ff

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
